  - id: polish-02
    type: polish
    title: "단계형 강화 연출과 결과별 피드백"
    estimate_minutes: 30
    dependencies:
      - polish-01
    description: |-
      목표:
        강화 모달에 강화 중·별 반짝임·결과판의 결정론적 연출과 성공·실패·파괴별 피드백, 연속 강화 흐름을 추가한다.

      Acceptance criteria:
        - 유효한 Space 강화는 강화권을 정확히 한 장 소비하고 enhancing, 별 반짝임, result 순서로 진행한다.
        - enhancing 동안 추가 입력은 코드 편집, 모달 종료 또는 중복 강화를 일으키지 않는다.
        - 성공 결과판은 금색 성공 문양과 상승 전·후 별을 표시하고 코드를 유지한다.
        - 일반 실패 결과판은 주황색 실패 문양과 실제 소실된 최근 직접 입력 문자 수를 표시한다.
        - 파괴 결과판은 붉은 이중 테두리와 파괴 문양, 전체 소실 문자 수와 0성 초기화를 표시한다.
        - result 상태에서 강화권이 남아 있으면 Space로 모달을 유지한 채 다음 강화를 시작한다.
        - result 상태의 Tab 또는 Esc는 갱신된 강화 상태를 유지하고 편집기로 돌아간다.
        - 강화권이 없는 result 상태의 Space는 새 강화를 실행하지 않고 부족 안내를 표시한다.
        - 강화 시작부터 결과판 표시까지의 전체 연출 목표는 약 1초다.
        - 단계별 연출 시간은 주입 가능한 스케줄러 또는 시계로 제어하며 테스트가 실제 시간이나 타이밍에 의존하지 않는다.
        - 색상 미지원 환경에서도 문양·테두리·문구로 세 결과를 구분한다.
        - 성공·실패·파괴, 입력 잠금, 연속 강화와 모달 종료를 headless TUI 테스트로 검증한다.

      검증 명령:
        npm test -- tests/tui/starforce-animation.test.tsx
        npm run typecheck
        npm run check
    completed: false
