version: 1
project: starforce-tui-editor

tasks:
  - id: core-01
    type: core
    title: "직접 입력과 강화권이 연결되는 편집 모델"
    estimate_minutes: 30
    dependencies: []
    description: |-
      목표:
        사용자가 단일 인메모리 버퍼에 여러 줄 및 Unicode 코드를 입력하고 커서를 옮기며, 직접 입력 10타마다 강화권을 얻는 첫 번째 headless vertical slice를 완성한다.

      Acceptance criteria:
        - 삽입, 커서 이동, 선택 없는 기본 삭제 연산을 순수한 편집 상태 전이로 제공한다.
        - 직접 입력한 문자·공백·개행은 Unicode grapheme 단위로 세고, 각 입력에는 이후 위치가 바뀌어도 추적 가능한 식별 정보를 둔다.
        - 누적 직접 입력이 10의 배수를 지날 때마다 강화권을 정확히 1장 지급한다.
        - 붙여넣기는 버퍼에 반영하지만 직접 입력 타수와 강화권을 늘리지 않는다.
        - Backspace, 삭제, 커서 이동, 단축키, 사용자 Undo는 직접 입력 타수를 늘리지 않는다.
        - 총 직접 입력 타수, 전체 버퍼 문자 수, 버퍼에 생존한 직접 입력 타수와 생산성 비율을 계산한다. 직접 입력이 0이면 생산성은 100%다.
        - 여러 줄, 한글, 결합 문자를 포함한 headless 테스트가 있다.

      검증 명령:
        npm test -- tests/editor/input-economy.test.ts
        npm run typecheck
        npm run check
    completed: true

  - id: core-02
    type: core
    title: "결정론적 스타포스 강화 엔진"
    estimate_minutes: 30
    dependencies:
      - core-01
    description: |-
      목표:
        강화권 한 장을 소비해 성공, 일반 실패, 파괴 중 하나를 반환하는 0~25성 도메인 흐름을 완성한다.

      Acceptance criteria:
        - RNG를 함수로 주입하거나 seed로 고정할 수 있고 경계값 테스트가 타이밍이나 실제 난수에 의존하지 않는다.
        - 강화권이 없으면 시도하지 않고 상태를 바꾸지 않으며, 유효한 시도는 결과와 무관하게 정확히 1장을 소비한다.
        - 성공은 별을 1 올리되 25성을 넘지 않고, 일반 실패는 별을 유지하며, 파괴 결과를 별도 타입으로 반환한다.
        - 확률 상수에 버전 `kms-starforce-pre-2025-03-rework`와 PRODUCT.md의 인벤 URL을 기록하고 실행 중 네트워크를 사용하지 않는다.
        - 이벤트와 스타캐치 보정 없이 다음 성공/일반 실패/파괴 백분율을 사용한다.
          0: 95/5/0, 1: 90/10/0, 2: 85/15/0, 3: 85/15/0,
          4: 80/20/0, 5: 75/25/0, 6: 70/30/0, 7: 65/35/0,
          8: 60/40/0, 9: 55/45/0, 10: 50/50/0, 11: 45/55/0,
          12: 40/60/0, 13: 35/65/0, 14: 30/70/0,
          15~17: 30/67.9/2.1, 18~19: 30/67.2/2.8,
          20~21: 30/63/7, 22: 3/77.6/19.4,
          23: 2/68.6/29.4, 24: 1/59.4/39.6.
        - 각 행의 합이 100이고 대표 단계 및 확률 경계에 대한 headless 테스트가 있다.

      검증 명령:
        npm test -- tests/domain/starforce-engine.test.ts
        npm run typecheck
        npm run check
    completed: true

  - id: core-03
    type: core
    title: "실패·파괴가 코드와 통계에 남는 강화 흐름"
    estimate_minutes: 35
    dependencies:
      - core-01
      - core-02
    description: |-
      목표:
        강화 엔진 결과를 실제 편집 상태에 적용해 코드가 살아남거나 사라지는 핵심 게임 루프를 headless로 완성한다.

      Acceptance criteria:
        - 성공 시 코드가 유지되고 별과 다음 해금 단계가 즉시 갱신된다.
        - 일반 실패 시 별은 유지되고, 현재 버퍼에 생존한 가장 최근 직접 입력 grapheme을 위치와 줄에 관계없이 최대 10개 제거한다.
        - 최근 입력 일부가 Backspace나 Undo로 이미 사라졌으면 이를 건너뛰고 더 오래된 생존 직접 입력을 찾아 제거한다.
        - 일반 실패는 최초 로드 또는 붙여넣기로 들어온 문자를 직접 입력 10개 대신 제거하지 않는다.
        - 파괴 시 전체 인메모리 버퍼가 비워지고 별이 0성이 된다.
        - 일반 실패와 파괴의 삭제 내용, 원래 위치, 결과 시각을 내부 파괴 흔적에 기록한다.
        - 일반 실패 소실 문자 수, 파괴 소실 문자 수, 현재 문자 수, 생산성 비율, 최근 강화 결과를 상태에서 조회할 수 있다.
        - 여러 줄, Unicode, 이미 삭제된 최근 입력, 10개 미만 생존 입력, 붙여넣기가 섞인 경우를 테스트한다.

      검증 명령:
        npm test -- tests/domain/enhancement-flow.test.ts
        npm run typecheck
        npm run check
    completed: true

  - id: core-04
    type: core
    title: "편집기와 강화 HUD를 잇는 단일 TUI 화면"
    estimate_minutes: 40
    dependencies:
      - core-03
    description: |-
      목표:
        터미널 한 화면에서 코드를 입력하고 강화 결과와 모든 핵심 지표를 즉시 확인하는 playable vertical slice를 제공한다.

      Acceptance criteria:
        - 화면에 코드·커서, 현재/다음 별, 강화권, 세 결과 확률, 다음 해금 기능, 총 직접 입력, 현재 문자, 실패/파괴 소실, 생산성, 최근 결과를 표시한다.
        - 17~25성 기능의 잠금 상태와 해금 예정 목록을 표시한다.
        - `Tab`으로 편집기와 강화 버튼 포커스를 전환하며 현재 포커스가 시각적으로 구분된다.
        - 강화 버튼 포커스에서 `Space`를 누르면 강화권 1장을 소비해 강화하고 화면을 같은 프레임 흐름에서 갱신한다.
        - 편집기 포커스의 입력은 편집 모델로 전달되고, 긴 줄·작은 터미널·빈 버퍼·Unicode에서도 레이아웃이 깨지거나 종료되지 않는다.
        - 강화권이 없거나 잠긴 동작을 시도하면 상태 변경 없이 이해 가능한 HUD 메시지를 표시한다.
        - 정상 종료, 오류, `Ctrl+C`에서 raw mode, 커서, alternate screen을 복구한다.
        - 렌더링과 키 입력 흐름을 headless TUI 테스트로 검증한다.

      검증 명령:
        npm test -- tests/tui/editor-hud.test.tsx
        npm run typecheck
        npm run check
    completed: true

  - id: core-05
    type: core
    title: "0~15성 기능 해금과 자체 Undo"
    estimate_minutes: 35
    dependencies:
      - core-04
    description: |-
      목표:
        강화 성공이 편집 능력을 즉시 바꾸도록 0~15성 핵심 해금 규칙을 TUI 입력과 렌더링에 연결한다.

      Acceptance criteria:
        - 0성은 흑백 편집기이고, 3성부터 줄 번호를 표시한다.
        - 5성 전에는 Backspace가 버퍼를 바꾸지 않고 안내를 표시하며, 5성부터 정상 작동한다.
        - 편집기 포커스의 `Space`는 7성 전에는 버퍼를 바꾸지 않고 안내를 표시하며, 7성부터 공백 1타로 입력된다.
        - 10성 전에는 `Ctrl+Z`가 버퍼를 바꾸지 않고 안내를 표시하며, 10성부터 앱 내부 최근 사용자 편집을 Undo한다.
        - `Ctrl+Z`는 OS나 외부 편집기에 전달되지 않고, Undo 자체는 직접 입력 타수나 강화권을 늘리지 않는다.
        - 강화 성공 직후 별도 재시작 없이 새 기능이 활성화되고 HUD의 다음 해금 안내가 갱신된다.
        - 잠금 경계 2→3, 4→5, 6→7, 9→10, 11→12, 14→15를 headless 상태 및 TUI 테스트로 검증한다.

      검증 명령:
        npm test -- tests/tui/unlocks.test.tsx tests/editor/user-undo.test.ts
        npm run typecheck
        npm run check
    completed: true

  - id: core-06
    type: core
    title: "12성 Python 임시 실행과 결과 패널"
    estimate_minutes: 30
    dependencies:
      - core-05
    description: |-
      목표:
        12성부터 저장하지 않은 현재 버퍼를 안전하게 Python으로 실행하고 결과를 TUI에서 확인하게 한다.

      Acceptance criteria:
        - 12성 전 `Ctrl+R`은 실행하지 않고 해금 단계 안내만 표시한다.
        - 12성부터 현재 버퍼를 앱이 관리하는 별도 임시 `.py` 파일에 기록하고 `python3`로 실행한다.
        - 실행은 사용자가 지정한 실제 대상 파일을 생성하거나 수정하지 않는다.
        - 표준 출력, 표준 오류, 종료 코드를 구분해 결과 패널에 표시하고 빈 출력과 비정상 종료도 처리한다.
        - 임시 파일은 정상 완료와 오류 모두에서 정리하며 명령 인자에 사용자 코드를 보간하지 않는다.
        - 프로세스 실행 계층을 주입 가능하게 만들어 성공, 문법 오류, 런타임 오류를 외부 타이밍에 의존하지 않고 테스트한다.

      검증 명령:
        npm test -- tests/runtime/python-runner.test.ts tests/tui/python-run.test.tsx
        npm run typecheck
        npm run check
    completed: true

  - id: core-07
    type: core
    title: "안전한 파일 저장과 비정상 종료 복구"
    estimate_minutes: 40
    dependencies:
      - core-06
    description: |-
      목표:
        실행 인자로 받은 단일 Python 파일의 읽기, 복구, 15성 저장, 안전한 종료를 연결해 MVP happy path를 완성한다.

      Acceptance criteria:
        - `npm start -- <파일.py>`의 경로 하나를 받아 기존 파일은 읽기만 하고 없는 파일은 빈 버퍼로 시작한다.
        - 15성 전 `Ctrl+S`는 대상 파일을 생성하거나 수정하지 않고 해금 단계 안내만 표시한다.
        - 15성부터 `Ctrl+S`가 지정 경로에 현재 버퍼를 명시적으로 저장하고 성공 또는 실패를 HUD에 표시한다.
        - 버퍼 변경 때마다 대상 절대 경로로 식별되는 앱 전용 임시 위치에 복구본을 원자적으로 갱신한다.
        - 다음 실행에서 복구본이 있으면 복구 또는 폐기를 묻고 선택을 적용한다.
        - 정상 저장 또는 사용자의 명시적 폐기 후 복구본을 삭제한다. 파괴 흔적과 통계도 복구본에 포함한다.
        - 저장하지 않은 변경이 있는 `Ctrl+Q` 종료는 확인을 요구하며, 종료 취소와 명시적 폐기를 구분한다.
        - 15성 전 실행·강화·파괴·비정상 종료 경로에서 실제 대상 파일 바이트가 바뀌지 않는 통합 테스트가 있다.
        - 전체 happy path와 터미널 상태 복구 테스트가 통과한다.

      검증 명령:
        npm test -- tests/persistence/file-lifecycle.test.ts tests/e2e/happy-path.test.tsx
        npm run typecheck
        npm run check
    completed: true

  - id: stretch-01
    type: stretch
    title: "17성 Python 구문 오류 표시"
    estimate_minutes: 30
    dependencies:
      - core-07
    description: |-
      목표:
        모든 core 작업이 끝난 뒤, 17성부터 현재 버퍼의 Python 구문 오류 위치와 메시지를 편집기 안에서 확인하게 한다.

      Acceptance criteria:
        - 17성 전에는 구문 검사를 실행하거나 표시하지 않고 해금 예정 상태만 보여준다.
        - 17성부터 대상 파일을 건드리지 않는 임시 검사로 Python 구문 오류의 줄, 열, 메시지를 얻는다.
        - 오류 위치를 편집기 및 HUD에 표시하고, 오류가 없으면 기존 진단을 제거한다.
        - 빠른 연속 입력에서 오래된 검사 결과가 최신 버퍼를 덮어쓰지 않는다.
        - 새 dependency를 추가하지 않고 빈 파일, Unicode, 여러 오류 후보, 유효 코드의 headless 테스트를 제공한다.

      검증 명령:
        npm test -- tests/runtime/python-syntax.test.ts tests/tui/syntax-errors.test.tsx
        npm run typecheck
        npm run check
    completed: true

  - id: stretch-02
    type: stretch
    title: "20성 Python Syntax highlighting"
    estimate_minutes: 35
    dependencies:
      - stretch-01
    description: |-
      목표:
        모든 core 작업과 17성 진단이 끝난 뒤, 20성부터 Python 코드를 터미널 색상으로 구분해 보여준다.

      Acceptance criteria:
        - 20성 전에는 0성 흑백 및 기존 단계 표현을 유지하고 highlighting을 적용하지 않는다.
        - 20성부터 키워드, 문자열, 숫자, 주석을 최소 범위로 구분하며 원문과 커서 위치를 바꾸지 않는다.
        - 기존 터미널 스타일과 작은 화면에서도 읽을 수 있고 색상 미지원 환경에는 평문으로 안전하게 대체한다.
        - 긴 줄, 여러 줄, Unicode 문자열, 불완전한 Python 코드를 렌더링해도 중단되지 않는다.
        - 새 dependency를 추가하지 않고 렌더링 스냅샷과 커서 보존 테스트를 제공한다.

      검증 명령:
        npm test -- tests/tui/syntax-highlighting.test.tsx
        npm run typecheck
        npm run check
    completed: true

  - id: polish-01
    type: polish
    title: "중앙 강화 모달과 입력 포커스 격리"
    estimate_minutes: 30
    dependencies:
      - stretch-02
    description: |-
      목표:
        기존 강화 포커스를 클래식 골드 톤의 중앙 모달로 재구성하고, 강화 중 코드 입력을 완전히 차단하는 독립적인 TUI vertical slice를 완성한다.

      Acceptance criteria:
        - 편집기 포커스에서 Tab을 누르면 배경 편집기와 HUD가 어두워지고 중앙 강화 모달이 열린다.
        - 모달은 25성 별 게이지, 대상 파일 basename과 중립적인 코드 슬롯, 현재/다음 별, 강화권, 성공·실패·파괴 확률과 실패 위험을 표시한다.
        - 모달의 기본 스타일은 실제 게임 자산 없이 문자와 ANSI 색상으로 표현한 클래식 골드 톤이다.
        - 모달이 열린 동안 문자·공백·개행·Backspace·방향키와 Ctrl+Z/R/S 입력이 편집기, 실행 또는 저장 상태를 변경하지 않는다.
        - ready 상태에서 Space만 강화를 시작하며 Tab 또는 Esc는 상태 손실 없이 모달을 닫고 편집기 포커스로 돌아간다.
        - 강화권이 없거나 현재 별이 25성이면 상태 변경 없이 이유를 모달 안에 표시한다.
        - 터미널 크기에 따라 전체형, 축약형, 최소 안전형의 3단계 레이아웃을 사용한다.
        - 축약형은 파일 슬롯과 보조 설명을 숨기되 25성 게이지, 현재/다음 별, 확률, 강화권, 위험 안내와 입력을 유지한다.
        - 최소 안전형은 별을 현재 단계/25 형태로 축약하고 확률을 세로로 배치하되 강화에 필요한 정보와 결과를 유지한다.
        - 세 레이아웃의 전환 기준은 대표 터미널 크기의 headless 렌더링에서 잘림이 발생하지 않는 열·행으로 고정한다.
        - 색상 미지원 환경에서도 문구와 테두리만으로 포커스와 상태를 구분한다.
        - 모달 열기·닫기, 입력 차단, 강화 거부, 일반/축약 렌더링을 headless TUI 테스트로 검증한다.

      검증 명령:
        npm test -- tests/tui/starforce-modal.test.tsx
        npm run typecheck
        npm run check
